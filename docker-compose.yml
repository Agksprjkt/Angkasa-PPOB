services:
  app:
    image: "${APP_IMAGE:?Set APP_IMAGE in .env to a published GHCR image}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_PROVIDER: postgres
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_MODE_FILE: /app/.data/database-mode.json
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - database_url
      - redis_password
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ppob-data:/app/.data
    networks:
      - default
      - ppob-private
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ppob}
      POSTGRES_USER: ${POSTGRES_USER:-ppob}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ppob-private
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    command:
      - sh
      - -ec
      - exec redis-server --save "" --appendonly no --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    networks:
      - ppob-private
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5

  payment-reconciler:
    image: "${APP_IMAGE:?Set APP_IMAGE in .env to a published GHCR image}"
    env_file:
      - .env
    environment:
      PAYMENT_RECONCILER_URL: http://app:3000/api/internal/reconcile-payments
      DIGIFLAZZ_SYNC_URL: http://app:3000/api/internal/digiflazz-product-sync
    working_dir: /app
    command: ["node", "scripts/payment-reconciler.mjs"]
    networks:
      - default
      - ppob-private
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # TLS terminator. Opt-in via the `tls` profile so a local or internal-only
  # deployment does not try to obtain a certificate: `docker compose --profile tls up -d`.
  # It reaches the app over the default network; the app port stays bound to host
  # loopback so nothing is exposed directly.
  #
  # PPOB_SITE_ADDRESS decides the scheme:
  #   http://1.2.3.4   plain HTTP on port 80 (IP only, no certificate possible)
  #   example.com      automatic HTTPS with a Let's Encrypt certificate
  # Switching to a real domain is a one-line change with no other edits.
  caddy:
    image: caddy:2-alpine
    profiles:
      - tls
    environment:
      PPOB_SITE_ADDRESS: ${PPOB_SITE_ADDRESS:-http://localhost}
      PPOB_ACME_EMAIL: ${PPOB_ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - default
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ppob-data:
  postgres-data:
  caddy-data:
  caddy-config:

secrets:
  database_url:
    file: ${DATABASE_URL_SECRET_FILE:-./secrets/database_url}
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:-./secrets/postgres_password}
  redis_password:
    file: ${REDIS_PASSWORD_SECRET_FILE:-./secrets/redis_password}

networks:
  ppob-private:
    internal: true
